name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source branch, tag, or commit"
        required: true
        default: "main"
        type: string
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out public builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: builder

      - name: Check out private source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: fireunix-app/shadow-agent
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.SOURCE_REPO_PAT }}
          persist-credentials: false
          path: source

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Install eBPF build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang llvm libbpf-dev

      - name: Generate, test, and package
        shell: bash
        env:
          VERSION_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          private_log="${RUNNER_TEMP}/private-build.log"
          set +e
          (
            set -euo pipefail
            version="${VERSION_TAG#v}"
            mkdir -p dist

            cd source
            go generate ./pkg/xdp
            go test ./...

            for arch in amd64 arm64; do
              archive="shadow-agent-${version}-linux-${arch}"
              package_dir="../dist/${archive}"
              mkdir -p "${package_dir}/config"

              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build \
                -trimpath \
                -ldflags="-s -w -X shadowbridge/data-plane/pkg/nodeinfo.Version=${version}" \
                -o "../dist/bridge-linux-${arch}" .

              install -m 0755 "../dist/bridge-linux-${arch}" "${package_dir}/bridge"
              install -m 0644 deploy/shadowbridge-dataplane.service "${package_dir}/shadow-agent.service"
              install -m 0644 config/example.toml "${package_dir}/config/example.toml"
              install -m 0644 ../builder/README.md "${package_dir}/README.md"
              tar -C ../dist -czf "../dist/${archive}.tar.gz" "${archive}"
              rm -rf "${package_dir}" "../dist/bridge-linux-${arch}"
            done

            cd ..
            sha256sum dist/*.tar.gz > dist/SHA256SUMS
            rm -rf source
          ) >"${private_log}" 2>&1
          status=$?
          set -e
          rm -f "${private_log}"
          if (( status != 0 )); then
            echo "::error::Private source build failed; detailed output was intentionally withheld."
            exit "${status}"
          fi

      - name: Store release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-agent-release
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Install release tools
        if: inputs.publish
        shell: bash
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          command -v gh >/dev/null
          if ! command -v aws >/dev/null 2>&1; then
            curl -fsSLo /tmp/awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            sudo /tmp/aws/install
          fi

      - name: Upload release artifacts to Cloudflare R2
        if: inputs.publish
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: "true"
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          : "${AWS_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID is not configured}"
          : "${AWS_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY is not configured}"
          : "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID is not configured}"
          : "${R2_BUCKET:?R2_BUCKET is not configured}"
          : "${R2_PUBLIC_URL:?R2_PUBLIC_URL is not configured}"

          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          prefix="Agent/${RELEASE_TAG}"
          public_url="${R2_PUBLIC_URL%/}"
          version="${RELEASE_TAG#v}"
          amd64_file="shadow-agent-${version}-linux-amd64.tar.gz"
          arm64_file="shadow-agent-${version}-linux-arm64.tar.gz"
          amd64_sha="$(awk -v file="${amd64_file}" '{ name=$2; sub(/^.*\//, "", name); if (name == file) { print $1; exit } }' dist/SHA256SUMS)"
          arm64_sha="$(awk -v file="${arm64_file}" '{ name=$2; sub(/^.*\//, "", name); if (name == file) { print $1; exit } }' dist/SHA256SUMS)"
          test -n "${amd64_sha}"
          test -n "${arm64_sha}"

          aws s3 sync dist "s3://${R2_BUCKET}/${prefix}/" \
            --endpoint-url "${endpoint}" \
            --exclude "*" \
            --include "*.tar.gz" \
            --include "SHA256SUMS" \
            --cache-control "public,max-age=0,must-revalidate" \
            --only-show-errors

          jq -n \
            --arg version "${RELEASE_TAG}" \
            --arg released_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg amd64_url "${public_url}/${prefix}/${amd64_file}" \
            --arg amd64_sha "${amd64_sha}" \
            --arg arm64_url "${public_url}/${prefix}/${arm64_file}" \
            --arg arm64_sha "${arm64_sha}" \
            --arg checksums_url "${public_url}/${prefix}/SHA256SUMS" \
            '{
              version: $version,
              released_at: $released_at,
              files: {
                amd64: {url: $amd64_url, sha256: $amd64_sha},
                arm64: {url: $arm64_url, sha256: $arm64_sha}
              },
              checksums_url: $checksums_url
            }' > dist/latest.json

          aws s3 cp dist/latest.json "s3://${R2_BUCKET}/Agent/latest.json" \
            --endpoint-url "${endpoint}" \
            --content-type "application/json" \
            --cache-control "no-cache,max-age=0" \
            --only-show-errors

      - name: Publish GitHub Release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_PAT }}
          RELEASE_TAG: ${{ inputs.version }}
          TARGET_REPOSITORY: fireunix-app/shadow-agent
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?RELEASE_REPO_PAT is not configured}"
          [[ "${TARGET_REPOSITORY}" == fireunix-app/* ]]
          [[ "$(gh api "repos/${TARGET_REPOSITORY}" --jq '.private')" == "true" ]]
          if ! gh api "repos/${TARGET_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "::error::Release tag must already exist in the private source repository."
            exit 1
          fi
          assets=(dist/*.tar.gz dist/SHA256SUMS)
          if gh release view "${RELEASE_TAG}" --repo "${TARGET_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --clobber \
              --repo "${TARGET_REPOSITORY}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            "${assets[@]}" \
            --repo "${TARGET_REPOSITORY}" \
            --verify-tag \
            --title "Shadow Agent ${RELEASE_TAG}" \
            --notes "Binaries built from the configured private source ref."
